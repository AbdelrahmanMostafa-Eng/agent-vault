name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check src tests

      - name: Run Ruff lint
        run: ruff check src tests

      - name: Run strict type checking
        run: mypy src

      - name: Run tests with coverage
        run: pytest --cov=agent_vault --cov-report=term-missing

      - name: Audit dependencies
        run: pip-audit

      - name: Build wheel and source distribution
        run: python -m build --outdir dist

      - name: Verify build artifacts
        shell: bash
        run: |
          compgen -G 'dist/*.whl' >/dev/null
          compgen -G 'dist/*.tar.gz' >/dev/null

  package-smoke-test:
    name: Fresh package installation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install build
          python -m build --outdir dist

      - name: Install wheel in a fresh virtual environment
        shell: bash
        run: |
          python -m venv /tmp/agent-vault-ci-venv
          /tmp/agent-vault-ci-venv/bin/python -m pip install dist/*.whl
          /tmp/agent-vault-ci-venv/bin/agent-vault --help
          /tmp/agent-vault-ci-venv/bin/python -m agent_vault --help
