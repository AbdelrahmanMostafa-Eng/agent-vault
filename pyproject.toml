[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-vault"
version = "1.0.0"
description = "A local-first, encrypted memory layer for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent-Vault Contributors" }]
keywords = ["ai-agents", "memory", "context", "local-first", "sqlite", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["cryptography>=42.0.0"]

[project.optional-dependencies]
dev = [
  "setuptools>=83.0.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "build>=1.2.0",
  "mypy>=1.10.0",
  "pip-audit>=2.7.0",
]

[project.scripts]
agent-vault = "agent_vault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["agent_vault"]
omit = ["src/agent_vault/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
fail_under = 98
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
pretty = true
